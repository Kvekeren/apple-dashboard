<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 28px 32px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 78px; border-radius: 8px; border: 1px solid var(--ink-08); }
  .name { font-size: 12px; color: var(--ink); font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
</style></head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#004077"></div><div class="name">blue</div><div class="hex">#004077</div></div>
    <div class="sw"><div class="chip" style="background:#002F58"></div><div class="name">blue-dark</div><div class="hex">#002F58</div></div>
    <div class="sw"><div class="chip" style="background:#001E3B"></div><div class="name">blue-deep / ink</div><div class="hex">#001E3B</div></div>
    <div class="sw"><div class="chip" style="background:#DCE7F0"></div><div class="name">blue-soft</div><div class="hex">#DCE7F0</div></div>
    <div class="sw"><div class="chip" style="background:#F0F4F8"></div><div class="name">blue-pale</div><div class="hex">#F0F4F8</div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF; border:1px solid var(--ink-12)"></div><div class="name">paper</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:#C9D6E0"></div><div class="name">pattern-1</div><div class="hex">#C9D6E0</div></div>
    <div class="sw"><div class="chip" style="background:#E5ECF2"></div><div class="name">pattern-2</div><div class="hex">#E5ECF2</div></div>
  </div>
</body></html>
