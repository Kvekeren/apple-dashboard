<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 28px 32px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; font-family: 'Sharp Grotesk', sans-serif; font-size: 14px; font-weight: 600; padding: 12px 20px; border-radius: 4px; border: 1px solid #004077; background: #004077; color: #FFFFFF; cursor: pointer; transition: background 150ms, border-color 150ms; }
  .btn:hover, .btn.hover { background: #002F58; border-color: #002F58; }
  .btn.ghost { background: transparent; color: #004077; }
  .btn.ghost:hover, .btn.ghost.hover { background: #004077; color: #FFFFFF; }
  .btn.text { background: transparent; border: 0; color: #004077; padding: 12px 0; border-radius: 0; border-bottom: 1px solid #DCE7F0; }
  .btn.text:hover { border-bottom-color: #004077; }
  .label { font-family: 'Sharp Grotesk', sans-serif; font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; min-width: 64px; }
  .arrow { font-size: 16px; line-height: 1; }
</style></head>
<body>
  <div class="row">
    <div class="label">Default</div>
    <button class="btn">Adverteren <span class="arrow">→</span></button>
    <button class="btn ghost">Werken bij</button>
    <button class="btn text">Lees meer →</button>
  </div>
  <div class="row">
    <div class="label">Hover</div>
    <button class="btn hover">Adverteren <span class="arrow">→</span></button>
    <button class="btn ghost hover">Werken bij</button>
  </div>
</body></html>
