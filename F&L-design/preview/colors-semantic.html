<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 32px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 78px; border-radius: 8px; border: 1px solid var(--ink-08); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-family: 'Sharp Grotesk', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  .name { font-size: 12px; color: var(--ink); font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
</style></head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#2E8B5F">Success</div><div class="name">success</div><div class="hex">#2E8B5F</div></div>
    <div class="sw"><div class="chip" style="background:#C28A2E">Warning</div><div class="name">warning</div><div class="hex">#C28A2E</div></div>
    <div class="sw"><div class="chip" style="background:#C8362B">Danger</div><div class="name">danger</div><div class="hex">#C8362B</div></div>
    <div class="sw"><div class="chip" style="background:#004077">Info</div><div class="name">info</div><div class="hex">#004077</div></div>
  </div>
</body></html>
