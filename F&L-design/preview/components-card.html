<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 32px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: var(--paper); border: 1px solid var(--ink-08); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,30,59,.04), 0 8px 24px rgba(0,30,59,.06); display: flex; flex-direction: column; transition: transform 150ms, box-shadow 150ms; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(0,30,59,.06), 0 14px 32px rgba(0,30,59,.10); }
  .img { background: #004077; min-height: 130px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-family: 'Sharp Grotesk', sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -0.03em; }
  .img.alt { background: #DCE7F0; color: #004077; }
  .body { padding: 16px 18px; display:flex; flex-direction:column; gap: 8px; }
  .tags { display:flex; gap:8px; }
  .tag { font-family: 'Sharp Grotesk', sans-serif; font-size: 11px; color: #004077; letter-spacing:.06em; font-weight: 500; }
  .h { font-family: 'Sharp Grotesk', sans-serif; font-size: 19px; font-weight: 600; line-height: 1.2; color: #004077; letter-spacing: -0.015em; }
  .meta { font-family: 'Sharp Grotesk', sans-serif; font-size: 12px; color: var(--ink-3); }
</style></head>
<body>
  <div class="grid">
    <div class="card">
      <div class="img">F&amp;L</div>
      <div class="body">
        <div class="tags"><span class="tag">#samenwerking</span><span class="tag">#foodies</span></div>
        <div class="h">Foodies opent eigen Foodies Studio</div>
        <div class="meta">12 mrt 2024</div>
      </div>
    </div>
    <div class="card">
      <div class="img alt">F&amp;L</div>
      <div class="body">
        <div class="tags"><span class="tag">#magazine</span></div>
        <div class="h">Liefhebbers van magazines, makers van content</div>
        <div class="meta">F&amp;L Media · Over Ons</div>
      </div>
    </div>
  </div>
</body></html>
