<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 32px; display:flex; flex-direction:column; gap: 18px; }
  .field { display:flex; flex-direction:column; gap: 6px; }
  label { font-family: 'Sharp Grotesk', sans-serif; font-size: 11px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
  input, textarea { font-family: 'Sharp Grotesk', sans-serif; font-size: 15px; color: var(--ink); background: var(--paper); border: 1px solid var(--ink-12); border-radius: 4px; padding: 12px 14px; outline: none; transition: border-color 150ms; }
  input:focus, textarea:focus { border-color: #004077; }
  .row { display:flex; gap:14px; }
  .row > .field { flex: 1; }
  .help { font-family: 'Sharp Grotesk', sans-serif; font-size: 12px; color: var(--ink-3); }
</style></head>
<body>
  <div class="row">
    <div class="field">
      <label>Naam</label>
      <input type="text" value="Pieter de Vries">
    </div>
    <div class="field">
      <label>E-mail</label>
      <input type="email" placeholder="naam@bedrijf.nl">
    </div>
  </div>
  <div class="field">
    <label>Bericht</label>
    <textarea rows="3" placeholder="Waar kunnen we je mee helpen?"></textarea>
    <div class="help">We reageren meestal binnen één werkdag.</div>
  </div>
</body></html>
