<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; }
  .nav { display:flex; align-items:center; justify-content:space-between; padding: 18px 28px; background: var(--paper); border-bottom: 1px solid var(--ink-08); }
  .left { display:flex; align-items:center; gap: 32px; }
  .logo img { height: 28px; display: block; }
  .links { display:flex; gap: 24px; }
  .links a { font-family: 'Sharp Grotesk', sans-serif; font-size: 14px; color: var(--ink); text-decoration: none; font-weight: 500; transition: color 150ms; }
  .links a:hover, .links a.active { color: #004077; }
  .cta { font-family: 'Sharp Grotesk', sans-serif; font-size: 13px; font-weight: 600; padding: 10px 18px; border-radius: 4px; background: #004077; color: #FFFFFF; border: 0; cursor: pointer; transition: background 150ms; }
  .cta:hover { background: #002F58; }
</style></head>
<body>
  <div class="nav">
    <div class="left">
      <div class="logo"><img src="../assets/logo-horizontal.svg" alt="F&L Media"></div>
      <div class="links">
        <a href="#" class="active">Over Ons</a>
        <a href="#">Onze Merken</a>
        <a href="#">Adverteren</a>
        <a href="#">Werken bij</a>
        <a href="#">Contact</a>
      </div>
    </div>
    <button class="cta">Adverteren →</button>
  </div>
</body></html>
