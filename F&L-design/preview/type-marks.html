<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 32px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .pair { display: flex; align-items: center; gap: 18px; }
  .label { font-family: 'Sharp Grotesk', sans-serif; font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; min-width: 96px; font-weight: 500; }
  .glyph-set { display: flex; gap: 22px; align-items: baseline; }
  .glyph { font-family: 'Sharp Grotesk', sans-serif; color: #004077; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
  .gmeta { font-family: 'Sharp Grotesk', sans-serif; font-size: 11px; color: var(--ink-3); }
</style></head>
<body>
  <div class="stack">
    <div class="pair">
      <div class="label">F&amp;L</div>
      <div class="glyph-set">
        <div><span class="glyph" style="font-size:64px">F&amp;L</span><div class="gmeta">64px</div></div>
        <div><span class="glyph" style="font-size:40px">F&amp;L</span><div class="gmeta">40px</div></div>
        <div><span class="glyph" style="font-size:24px">F&amp;L</span><div class="gmeta">24px</div></div>
      </div>
    </div>
    <div class="pair">
      <div class="label">Hashtag</div>
      <div class="glyph-set" style="gap:8px;">
        <span style="font-family:'Sharp Grotesk';font-size:13px;font-weight:500;color:#004077;letter-spacing:.06em;text-transform:lowercase;padding:6px 10px;border-radius:4px;">#samenwerking</span>
        <span style="font-family:'Sharp Grotesk';font-size:13px;font-weight:500;color:#004077;letter-spacing:.06em;text-transform:lowercase;background:#DCE7F0;padding:6px 10px;border-radius:4px;">#foodies</span>
        <span style="font-family:'Sharp Grotesk';font-size:13px;font-weight:500;color:#004077;letter-spacing:.06em;text-transform:lowercase;padding:6px 10px;border-radius:4px;">#magazine</span>
      </div>
    </div>
  </div>
</body></html>
