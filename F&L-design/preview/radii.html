<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 32px; }
  .row { display: flex; gap: 28px; align-items: center; }
  .demo { width: 90px; height: 60px; background: #ECE5D5; border: 1px solid var(--ink-12); }
  .stack { display:flex; flex-direction:column; gap:6px; align-items:center; }
  .name { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3); }
  .val { font-size: 11px; color: var(--ink); font-weight: 600; font-family: 'Sharp Grotesk', sans-serif; }
</style></head>
<body>
  <div class="row">
    <div class="stack"><div class="demo" style="border-radius:0"></div><div class="val">0</div><div class="name">r-0 · sections</div></div>
    <div class="stack"><div class="demo" style="border-radius:4px"></div><div class="val">4</div><div class="name">r-sm · buttons</div></div>
    <div class="stack"><div class="demo" style="border-radius:8px"></div><div class="val">8</div><div class="name">r-md · cards</div></div>
    <div class="stack"><div class="demo" style="border-radius:12px"></div><div class="val">12</div><div class="name">r-lg</div></div>
    <div class="stack"><div class="demo" style="border-radius:999px"></div><div class="val">999</div><div class="name">r-pill</div></div>
  </div>
</body></html>
