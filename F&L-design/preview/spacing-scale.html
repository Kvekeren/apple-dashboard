<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 32px; }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: #004077; border-radius: 2px; width: 28px; }
  .name { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3); }
  .px { font-family: 'Sharp Grotesk', sans-serif; font-size: 11px; color: var(--ink); font-weight: 600; }
</style></head>
<body>
  <div class="row">
    <div class="step"><div class="bar" style="height:4px"></div><div class="px">4</div><div class="name">s-1</div></div>
    <div class="step"><div class="bar" style="height:8px"></div><div class="px">8</div><div class="name">s-2</div></div>
    <div class="step"><div class="bar" style="height:12px"></div><div class="px">12</div><div class="name">s-3</div></div>
    <div class="step"><div class="bar" style="height:16px"></div><div class="px">16</div><div class="name">s-4</div></div>
    <div class="step"><div class="bar" style="height:24px"></div><div class="px">24</div><div class="name">s-5</div></div>
    <div class="step"><div class="bar" style="height:32px"></div><div class="px">32</div><div class="name">s-6</div></div>
    <div class="step"><div class="bar" style="height:48px"></div><div class="px">48</div><div class="name">s-7</div></div>
    <div class="step"><div class="bar" style="height:64px"></div><div class="px">64</div><div class="name">s-8</div></div>
    <div class="step"><div class="bar" style="height:96px"></div><div class="px">96</div><div class="name">s-9</div></div>
    <div class="step"><div class="bar" style="height:128px"></div><div class="px">128</div><div class="name">s-10</div></div>
  </div>
</body></html>
